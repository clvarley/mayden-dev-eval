
services:
  nginx:
    image: nginx:latest
    depends_on:
      - php
    ports:
      - 80:80
    expose:
      - 80
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - default
  php:
    image: clvarley/php:8.5-fpm
    depends_on:
      - database
    build:
      context: ./
      dockerfile: PHP.Dockerfile
    networks:
      - default
    volumes:
      - ./:/var/www/html
  database:
    image: mariadb:latest
    networks:
      - default
    expose:
      - 3306
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: shopping
      MARIADB_USER: symfony
      MARIADB_PASSWORD: password 
